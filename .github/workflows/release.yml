name: Release

# Pushing a v* tag builds that tag, signs it and publishes it twice: as a
# Flatpak repository on GitHub Pages, which is what installs update from, and
# as a single-file bundle on the GitHub release. docs/RELEASING.md has the
# one-time setup (signing key, Pages) and the steps for cutting a release.
on:
  push:
    tags: ['v*']
  # Publishes an existing tag again, for example after the Pages setup changed.
  # The tag's own source, scripts and config are what get built.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish, such as v1.0.1
        required: true

permissions:
  contents: read

# Two releases deploying to the same Pages site must not interleave, and one
# that has started signing should finish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-latest
    # pages: read is for configure-pages, which asks the API for the site URL.
    permissions:
      contents: read
      pages: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    env:
      # The container's HOME (/github/home) sits under a world-writable /github, which the
      # SWC native addon refuses to use as a cache root. Keep caches under root's home.
      XDG_CACHE_HOME: /root/.cache
      SWC_NATIVE_BINDING_CACHE: /root/.cache/swc
      TAG: ${{ inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Prepare cache directory
        run: mkdir -p /root/.cache/swc && chmod 700 /root/.cache

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # gtkx deploy names the release after package.json, so the tag must agree.
      - name: Check the tag
        id: tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag"
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag is $TAG but its package.json says $version"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Import the signing key
        id: key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$FLATPAK_GPG_PRIVATE_KEY" ]; then
            echo "::error::the FLATPAK_GPG_PRIVATE_KEY secret is not set, see docs/RELEASING.md"
            exit 1
          fi
          printf '%s\n' "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --list-secret-keys --with-colons \
            | awk -F: '$1=="fpr"{print $10; exit}')
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      # gtkx deploy builds against the GNOME 50 runtime from the user installation, and codegen
      # needs GTK's GIR files, which this container only has inside the SDK.
      - name: Install the GNOME 50 SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//50 org.gnome.Sdk//50
          echo "GTKX_GIR_PATH=$(flatpak info --user --show-location org.gnome.Sdk//50)/files/share/gir-1.0" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Leaves the OSTree repo in build/targets/flatpak/repo and the bundle in build/out/.
      - name: Build
        run: pnpm build:flatpak

      - name: Find the Pages URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Sign and assemble the site
        run: |
          build-aux/publish-repo.sh build/targets/flatpak/repo site \
            "${{ steps.pages.outputs.base_url }}" \
            "${{ steps.key.outputs.fingerprint }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: build/out/*.flatpak
          if-no-files-found: error

  pages:
    name: Publish the repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  bundle:
    name: Attach the bundle
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      # The release may already exist, when the tag was made by drafting the
      # release on GitHub.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.flatpak --clobber
          else
            gh release create "$TAG" ./*.flatpak \
              --title "Cafe ${TAG#v}" --generate-notes
          fi
